[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "auto-resume-builder"
version = "0.1.0-alpha"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "google-generativeai>=0.8.4",
    "pydantic>=2.0",
    "platformdirs>=4.2.0",
    "pypdf>=4.0.0"
]
description = "A target-aware resume generation engine."

[project.scripts]
arb = "arb.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.tex", "*.toml", "*.md", "*.txt"]
