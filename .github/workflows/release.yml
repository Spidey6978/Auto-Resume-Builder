name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel and SDist
        run: python -m build

      - name: Install Wheel in fresh virtualenv
        run: |
          python -m venv .venv-wheel-test
          source .venv-wheel-test/bin/activate
          # Find and install the wheel
          pip install dist/*.whl

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke Test (Isolated)
        run: |
          source .venv-wheel-test/bin/activate
          
          echo "Testing CLI presence and help:"
          arb --help
          
          echo "Testing doctor (will fail on tools but should not crash):"
          arb doctor || true
          
          # Initialize headless by seeding the canonical profile via ARB's public CLI
          echo -e "personal:\n  name: 'Test'\nexperience: []\nprojects: []\neducation: []\nskills: []" > fixture.yaml
          arb init --non-interactive --profile fixture.yaml
          
          echo "Testing mock build:"
          arb build --target backend --mock-ai --output backend_resume.pdf
          
          echo "Verifying output PDF exists:"
          test -f backend_resume.pdf || { echo "PDF not generated!"; exit 1; }

      - name: Upload Artifacts
        # Only upload artifacts from one python version run to avoid duplication
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: auto-resume-builder-packages
          path: dist/*

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Tectonic
        run: |
          mkdir bin
          Invoke-WebRequest -Uri "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-pc-windows-msvc.zip" -OutFile "tectonic.zip"
          Expand-Archive -Path "tectonic.zip" -DestinationPath "bin"
          Remove-Item "tectonic.zip"

      - name: Build Executable
        run: pyinstaller arb.spec

      - name: Rename Executable
        run: Rename-Item -Path "dist\arb.exe" -NewName "arb-windows-x64.exe"

      - name: Smoke Test Executable
        run: |
          # Test help
          .\dist\arb-windows-x64.exe --help
          
          # Test doctor (may exit non-zero due to missing profile/keys, but shouldn't crash)
          .\dist\arb-windows-x64.exe doctor; if ($LASTEXITCODE -ne 0) { Write-Host "Doctor returned non-zero (expected)" }
          
          # Seed canonical profile dynamically via ARB's public CLI
          "personal:`n  name: 'Test'`nexperience: []`nprojects: []`neducation: []`nskills: []" | Out-File -Encoding utf8 fixture.yaml
          .\dist\arb-windows-x64.exe init --non-interactive --profile fixture.yaml
          
          # Test mock build
          .\dist\arb-windows-x64.exe build --target backend --mock-ai --output backend_resume.pdf
          
          # Verify PDF
          if (!(Test-Path "backend_resume.pdf")) { throw "PDF not generated!" }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: auto-resume-builder-windows-exe
          path: dist/arb-windows-x64.exe

  release:
    needs: [build-and-test, build-windows-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auto-resume-builder-packages
          path: dist
          
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auto-resume-builder-windows-exe
          path: dist
          
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
