name: Build and Compile Resume

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'templates/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  build-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Tectonic (LaTeX Compiler)
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and Compile Resume
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     
        run: |
          mkdir -p build
          if [ -f data/canonical_profile.yaml ]; then
            arb init --non-interactive --profile data/canonical_profile.yaml
          else
            echo -e "personal:\n  name: 'Veer Gopani'\n  email: 'veergopani70@gmail.com'\n  github: 'https://github.com/Spidey6978'\nexperience: []\nprojects: []\neducation: []\nskills: []" > build_fixture.yaml
            arb init --non-interactive --profile build_fixture.yaml
          fi
          arb build --target backend --mock-ai --output build/resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automated_Resume
          path: build/resume.pdf
          retention-days: 90